<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Interativo | Microsoft Foundry</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-container">
        <!-- Cabeçalho do Chat -->
        <header class="chat-header">
            <div class="header-info">
                <div class="bot-avatar">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                        <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2M7.5 13A2.5 2.5 0 0 0 5 15.5 2.5 2.5 0 0 0 7.5 18a2.5 2.5 0 0 0 2.5-2.5A2.5 2.5 0 0 0 7.5 13m9 0a2.5 2.5 0 0 0-2.5 2.5 2.5 2.5 0 0 0 2.5 2.5 2.5 2.5 0 0 0 2.5-2.5 2.5 2.5 0 0 0-2.5-2.5z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="header-title">Agente Microsoft Foundry</h1>
                    <div class="header-status">
                        <span class="status-indicator" id="status-indicator"></span>
                        <span class="status-text" id="status-text">Conectando...</span>
                        <span class="model-badge" id="model-badge">gpt-5-mini</span>
                    </div>
                </div>
            </div>
            <div class="header-actions">
                <button id="clear-btn" class="btn-secondary" title="Limpar conversa">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path>
                    </svg>
                    <span>Limpar</span>
                </button>
            </div>
        </header>

        <!-- Área de Mensagens -->
        <main class="chat-messages" id="chat-messages">
            <!-- Mensagem Inicial de Boas-Vindas -->
            <div class="message assistant-message welcome-card">
                <div class="message-content">
                    <h3>👋 Olá! Sou seu agente do Microsoft Foundry.</h3>
                    <p>Como posso te ajudar hoje? Você pode digitar qualquer pergunta abaixo ou escolher uma das sugestões rápidas:</p>
                    
                    <div class="suggestion-chips">
                        <button class="chip-btn" data-prompt="Quem foi Ada Lovelace?">👩‍💻 Quem foi Ada Lovelace?</button>
                        <button class="chip-btn" data-prompt="O que é o Azure AI Foundry e como funciona?">☁️ O que é o Microsoft Foundry?</button>
                        <button class="chip-btn" data-prompt="Como conectar um modelo Python ao Microsoft Foundry?">🐍 Conectar Python ao Foundry</button>
                    </div>
                </div>
                <span class="message-time">Agora</span>
            </div>
        </main>

        <!-- Indicador de Digitação -->
        <div class="typing-indicator" id="typing-indicator">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="typing-text">O agente está pensando...</span>
        </div>

        <!-- Área de Entrada de Mensagem -->
        <footer class="chat-footer">
            <form id="chat-form" class="chat-form">
                <textarea 
                    id="user-input" 
                    placeholder="Envie uma mensagem para o agente... (Pressione Enter para enviar, Shift+Enter para quebra de linha)" 
                    rows="1"
                    required
                ></textarea>
                <button type="submit" id="send-button" class="btn-send" title="Enviar Mensagem">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
            <div class="footer-note">
                Conectado ao Microsoft Foundry • Azure AI Services
            </div>
        </footer>
    </div>

    <!-- Script de lógica do chat -->
    <script src="script.js"></script>
</body>
</html>
